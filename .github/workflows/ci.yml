name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Windows is newly supported; keep it visible without blocking merges
          # until it has been green for a while. Flip to false once stable.
          - os: windows-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` runs `npm run build` (tsc), so dist/ exists for tests that
      # exercise the built entry points.
      - run: npm ci

      # Cache the ONNX model weights that @xenova/transformers downloads on
      # first use (all-MiniLM-L6-v2, bge-reranker-base, ...). The library's
      # default cacheDir is <package dir>/.cache, i.e. inside node_modules, so
      # this step must run AFTER `npm ci` (which wipes node_modules) and
      # before the tests that trigger the downloads.
      - name: Cache transformer model downloads
        uses: actions/cache@v4
        with:
          path: node_modules/@xenova/transformers/.cache
          key: ${{ runner.os }}-transformers-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-transformers-

      - run: npm run lint

      # tests/deployment validates the launchd template + installer contract and
      # .mcp.json path resolution; it runs on every OS now that templates use
      # placeholders instead of one developer's paths.
      - run: npm run test:run
